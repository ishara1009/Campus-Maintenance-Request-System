spring.application.name=campus-maintenance

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_maintenance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
app.auth.token-hours=24
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.upload.directory=${UPLOAD_DIRECTORY:./uploads}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:System Administrator}
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
